<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>Scroll PT</title>
<style>
  :root {
    --bg: #0e0f13;
    --fg: #f4f4f6;
    --muted: rgba(244,244,246,.62);
    --card-glass: rgba(255,255,255,.08);
    --ok: #34c77b;
    --bad: #ff5a5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* ===== Mechanizm scrollowania: jeden ekran = jedna karta ===== */
  #feed {
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;      /* zawsze dociąga do karty */
    overscroll-behavior-y: contain;     /* bez "odbijania" całej strony */
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }
  .card {
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;           /* jeden swipe = jedna karta, jak Reels */
    position: relative;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: calc(64px + env(safe-area-inset-top)) 76px calc(140px + env(safe-area-inset-bottom)) 20px;
    text-align: center;
    user-select: none;
    overflow: hidden;
  }
  .card > * { max-width: 520px; width: 100%; }

  /* ===== Górny pasek ===== */
  #top {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px 16px;
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
    pointer-events: none;
  }
  #top > * { pointer-events: auto; }
  #unitLabel { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { background: rgba(0,0,0,.32); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 0; color: var(--fg); border-radius: 999px;
    padding: 7px 10px; font-size: 14px; font-weight: 600; cursor: pointer; flex: none; }
  #progress { position: fixed; top: 0; left: 0; height: 3px; background: #fff; z-index: 11; transition: width .3s; }

  /* ===== Typografia kart ===== */
  .tag { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
  .pt { font-size: clamp(40px, 11vw, 64px); font-weight: 800; line-height: 1.05; margin: 0 0 12px; word-break: break-word; }
  .say { font-size: 18px; color: var(--muted); margin-bottom: 28px; }
  .say b { color: var(--fg); font-weight: 600; }
  .pl { font-size: 24px; font-weight: 600; padding: 14px 18px; border-radius: 16px; background: var(--card-glass);
    filter: blur(9px); transition: filter .25s; cursor: pointer; }
  .pl.shown { filter: none; }
  .reveal-hint { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .note { margin-top: 22px; font-size: 15px; line-height: 1.45; color: var(--muted); }
  .big-emoji { font-size: 72px; margin-bottom: 10px; }
  .intro h2 { font-size: 34px; margin: 0 0 14px; }
  .intro p, .tip p { font-size: 18px; line-height: 1.5; color: var(--muted); margin: 0 0 12px; }
  .tip h3 { font-size: 26px; margin: 0 0 14px; }

  /* ===== Prawa kolumna akcji (jak w Reels) ===== */
  .actions { position: absolute; right: 8px; bottom: calc(130px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px; width: auto; }
  .act { width: 60px; border: 0; background: none; color: #fff; font-size: 30px; cursor: pointer; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
  .act small { font-size: 12px; font-weight: 600; }
  .act.on span { color: #ff3b5c; display: inline-block; animation: bump .4s; }

  /* ===== Post: autor + podpis (lewy dół) ===== */
  .post-meta { position: absolute; left: 16px; right: 80px; bottom: calc(22px + env(safe-area-inset-bottom));
    text-align: left; max-width: none; width: auto; }
  .author { display: flex; align-items: center; gap: 8px; font-size: 15px; min-width: 0; }
  .author b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px;
    border: 2px solid #fff; flex: none; }
  .ago { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .follow { border: 1px solid #fff; background: transparent; color: #fff; border-radius: 8px; padding: 4px 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; flex: none; }
  .follow.on { background: rgba(255,255,255,.2); border-color: transparent; }
  .caption { margin-top: 8px; font-size: 14.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .hash { color: #9cd3ff; }

  /* ===== Filmik ===== */
  .vprog { position: absolute; top: calc(58px + env(safe-area-inset-top)); left: 16px; right: 16px; height: 3px;
    background: rgba(255,255,255,.25); border-radius: 2px; max-width: none; width: auto; }
  .vprog i { display: block; height: 100%; width: 0; background: #fff; transition: width .4s; }
  .scene { font-size: 60px; margin-bottom: 14px; }
  .bubbles { display: flex; flex-direction: column; gap: 10px; min-height: 200px; justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 9px 13px; border-radius: 18px; text-align: left; animation: bubbleIn .3s ease-out; }
  .bubble.A { align-self: flex-start; background: rgba(255,255,255,.18); border-bottom-left-radius: 4px; }
  .bubble.B { align-self: flex-end; background: #2f7cf6; border-bottom-right-radius: 4px; }
  .bpt { font-weight: 700; font-size: 17px; }
  .bpl { font-size: 13px; opacity: .78; margin-top: 3px; }
  @keyframes bubbleIn { from { transform: translateY(12px); opacity: 0 } }
  .vplay { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 96px; height: 96px;
    border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 44px; cursor: pointer;
    display: grid; place-items: center; }

  /* ===== Quiz ===== */
  .q-prompt { font-size: 18px; color: var(--muted); margin-bottom: 10px; }
  .q-word { font-size: clamp(32px, 9vw, 48px); font-weight: 800; margin-bottom: 26px; word-break: break-word; }
  .opts { display: grid; gap: 10px; }
  .opt { padding: 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,.18); background: var(--card-glass);
    color: var(--fg); font-size: 18px; font-weight: 600; cursor: pointer; transition: transform .1s, background .2s, border-color .2s; }
  .opt:active { transform: scale(.98); }
  .opt.ok { background: var(--ok); border-color: var(--ok); animation: okPop .35s; }
  .opt.bad { background: var(--bad); border-color: var(--bad); animation: shake .35s; }
  .opt:disabled { cursor: default; }
  @keyframes okPop { 50% { transform: scale(1.06) } }
  @keyframes shake { 25% { transform: translateX(-8px) } 75% { transform: translateX(8px) } }
  .feedback { min-height: 28px; margin-top: 16px; font-size: 16px; font-weight: 600; }
  .listen-btn { font-size: 54px; width: 110px; height: 110px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16);
    color: #fff; cursor: pointer; margin: 0 auto 26px; display: grid; place-items: center; }
  .boost { color: #7cf; }

  /* ===== Animacje ===== */
  .heart { position: absolute; left: 50%; top: 50%; font-size: 110px; transform: translate(-50%,-50%) scale(0);
    pointer-events: none; animation: pop .8s ease-out forwards; width: auto; }
  @keyframes pop { 30% { transform: translate(-50%,-50%) scale(1.15); opacity: 1 }
                   100% { transform: translate(-50%,-60%) scale(1); opacity: 0 } }
  .swipe-hint { position: absolute; bottom: calc(108px + env(safe-area-inset-bottom)); left: 0; right: 0;
    font-size: 14px; color: var(--muted); animation: bob 1.6s ease-in-out infinite; max-width: none; }
  @keyframes bob { 50% { transform: translateY(-8px) } }

  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(0,0,0,.8); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20;
    opacity: 0; transition: opacity .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  #toast.show { opacity: 1; }

  /* ===== Dopamina: XP, streak, combo, efekty ===== */
  .stat { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,0,0,.32); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: 999px;
    padding: 5px 9px 5px 6px; font-size: 14px; font-weight: 700; white-space: nowrap; flex: none; }
  .stat.bump { animation: bump .45s; }
  @keyframes bump { 40% { transform: scale(1.25) } }
  .ring { width: 22px; height: 22px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .bg { stroke: rgba(255,255,255,.25); }
  .ring .fg { stroke: #ffd23f; stroke-linecap: round; transition: stroke-dashoffset .5s; }
  #streak.cold { opacity: .55; filter: grayscale(1); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .floatxp { position: fixed; z-index: 31; font-weight: 800; font-size: 22px; color: #ffd23f; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,.5); animation: floatup 1.1s ease-out forwards; transform: translate(-50%, 0); }
  @keyframes floatup { to { transform: translate(-50%, -70px); opacity: 0 } }
  #combo { position: fixed; left: 50%; top: 22%; z-index: 31; transform: translate(-50%,-50%) scale(0);
    font-size: clamp(34px, 10vw, 54px); font-weight: 900; color: #ffd23f; white-space: nowrap; pointer-events: none;
    text-shadow: 0 4px 24px rgba(255,120,0,.8); }
  #combo.go { animation: comboPop 1.3s ease-out forwards; }
  @keyframes comboPop { 15% { transform: translate(-50%,-50%) scale(1.3) rotate(-4deg) } 30% { transform: translate(-50%,-50%) scale(1) }
                        80% { opacity: 1 } 100% { transform: translate(-50%,-80%) scale(1); opacity: 0 } }

  #overlay { position: fixed; inset: 0; z-index: 29; display: none; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(circle, rgba(60,30,120,.92), rgba(0,0,0,.94)); }
  #overlay.show { display: grid; animation: fadein .3s; }
  #overlay .lv { font-size: 96px; font-weight: 900; line-height: 1; color: #ffd23f; animation: comboPop2 .6s; }
  #overlay h2 { font-size: 30px; margin: 12px 0 6px; }
  #overlay p { color: var(--muted); font-size: 17px; margin: 0; }
  @keyframes fadein { from { opacity: 0 } }
  @keyframes comboPop2 { 0% { transform: scale(0) } 70% { transform: scale(1.2) } }

  .chest-box { font-size: 120px; cursor: pointer; display: inline-block; animation: wiggle 1.4s ease-in-out infinite; }
  @keyframes wiggle { 0%,70%,100% { transform: rotate(0) } 75% { transform: rotate(-10deg) } 85% { transform: rotate(10deg) } 95% { transform: rotate(-5deg) } }
  .chest-box.opening { animation: shakeBig .6s; }
  @keyframes shakeBig { 20%,60% { transform: rotate(-15deg) scale(1.1) } 40%,80% { transform: rotate(15deg) scale(1.15) } }
  .reward { font-size: 30px; font-weight: 900; color: #ffd23f; margin-top: 14px; animation: comboPop2 .5s; }
  .reward small { display: block; font-size: 16px; color: var(--fg); font-weight: 500; margin-top: 8px; }

  .card.rare::before { content: ""; position: absolute; inset: -50%; width: auto; max-width: none;
    background: conic-gradient(from 0deg, transparent, rgba(255,230,140,.25), transparent 30%);
    animation: spin 6s linear infinite; }
  .card.rare > div { position: relative; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .rare .pt { color: #ffe08a; }

  /* ===== Post ze zdjęciem ===== */
  .card.photo { justify-content: flex-end; background-size: cover !important; background-position: center !important; }
  .card.photo .pt, .card.photo h2, .card.photo .q-word { text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .card.photo .say, .card.photo .note, .card.photo .tag, .card.photo .q-prompt, .card.photo .reveal-hint,
  .card.photo.intro p { color: rgba(255,255,255,.88); text-shadow: 0 1px 8px rgba(0,0,0,.7); }
  .card.photo .pl, .card.photo .opt { background: rgba(0,0,0,.38); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .card.photo .pl:not(.shown) { filter: blur(9px); }
  .credit { position: absolute; top: calc(52px + env(safe-area-inset-top)); right: 12px; left: auto; width: auto; max-width: 70%;
    font-size: 10.5px; color: rgba(255,255,255,.75); text-decoration: none; text-align: right; text-shadow: 0 1px 4px #000;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }

  /* ===== Prawdziwe wideo ===== */
  .card.real { padding: 0; background: #000; }
  .card.real video, .card.real .shade { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
  .card.real video { object-fit: cover; }
  .card.real .shade { pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.45), transparent 22%, transparent 55%, rgba(0,0,0,.75)); }
  .card.real .vprog { z-index: 2; }
  .card.real .credit { top: calc(66px + env(safe-area-inset-top)); }
  .card.real .unmute { top: calc(90px + env(safe-area-inset-top)); }
  .subs { position: absolute; left: 16px; right: 80px; bottom: calc(150px + env(safe-area-inset-bottom)); width: auto;
    max-width: none; text-align: center; z-index: 2; pointer-events: none; transition: opacity .2s; }
  .subs span { display: inline-block; background: rgba(0,0,0,.62); border-radius: 12px; padding: 8px 12px; }
  .subs .bpt { font-size: 19px; }
  .subs:empty { opacity: 0; }
  .unmute { position: absolute; top: calc(72px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: auto; max-width: none; z-index: 3; border: 0; border-radius: 999px; padding: 8px 14px; font-size: 14px;
    font-weight: 600; color: #fff; background: rgba(0,0,0,.6); cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
<div id="progress"></div>
<div id="top">
  <span id="unitLabel">🇵🇹 Scroll PT</span>
  <span class="stat" id="streak" title="Streak">🔥 <span id="streakN">0</span></span>
  <span class="stat" id="xpStat" title="XP">
    <svg class="ring" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9"/><circle class="fg" id="goalRing" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"/></svg>
    <span id="xpN">0</span>
  </span>
  <button class="pill" id="langBtn" title="Język / Language">🇵🇱</button>
  <button class="pill" id="soundBtn" title="Dźwięk / Sound">🔊</button>
  <button class="pill" id="resetBtn" title="Od nowa / Restart">↺</button>
</div>
<main id="feed" aria-live="polite"></main>
<canvas id="fx"></canvas>
<div id="combo"></div>
<div id="overlay"></div>
<div id="toast"></div>

<script>
/* =========================================================
   TREŚCI: portugalski europejski (pt-PT) od podstaw.
   pl / en = tłumaczenia, say = wymowa zapisana "po polsku"
   (dla angielskiego przerabiana automatycznie: sz->sh itd.)
   ========================================================= */
const UNITS = [
  { id: 'ola', title: 'Powitania', titleEn: 'Greetings', emoji: '👋', bg: ['#1d3b8b', '#0f1f4d'],
    intro: ['Zaczynamy od słów, które usłyszysz pierwszego dnia w Portugalii.',
            'Przewijaj w górę. Dotknij rozmazanego tłumaczenia, żeby je odsłonić. Dwuklik = polub słówko ❤️'],
    introEn: ['Let’s start with the words you’ll hear on your first day in Portugal.',
              'Scroll up. Tap the blurred translation to reveal it. Double-tap = like the word ❤️'],
    items: [
      { pt: 'Olá', pl: 'Cześć / Dzień dobry', en: 'Hi / Hello', say: 'olá',
        note: 'Pasuje prawie zawsze, także w sklepie.', noteEn: 'Works almost everywhere, even in shops.' },
      { pt: 'Bom dia', pl: 'Dzień dobry (rano)', en: 'Good morning', say: 'bõ dija',
        note: 'Mówi się mniej więcej do pory obiadu.', noteEn: 'Used until roughly lunchtime.' },
      { pt: 'Boa tarde', pl: 'Dzień dobry (po południu)', en: 'Good afternoon', say: 'boa tard',
        note: 'Końcowe „e” prawie znika: tard.', noteEn: 'The final “e” almost disappears: tard.' },
      { pt: 'Boa noite', pl: 'Dobry wieczór / Dobranoc', en: 'Good evening / Good night', say: 'boa nojt' },
      { pt: 'Tudo bem?', pl: 'Co słychać? / Wszystko dobrze?', en: 'How are you? / All good?', say: 'tudu bãj',
        note: 'Odpowiedź: „Tudo bem, obrigado.”', noteEn: 'Answer: “Tudo bem, obrigado.”' },
      { pt: 'Até logo', pl: 'Na razie / Do zobaczenia', en: 'See you later', say: 'ate logu' },
      { pt: 'Adeus', pl: 'Do widzenia', en: 'Goodbye', say: 'adeusz',
        note: 'Końcowe „s” czytasz jak polskie „sz”.', noteEn: 'The final “s” sounds like English “sh”.' },
    ] },
  { tip: true, emoji: '🗣️', title: 'Zasada wymowy nr 1', titleEn: 'Pronunciation rule #1', bg: ['#4a2a7a', '#22133d'],
    text: ['„S” na końcu słowa i przed spółgłoską brzmi jak polskie „sz”.',
           'adeus → adeusz, dois → dojsz, português → purtugesz.',
           'To jedna z rzeczy, po których słychać portugalski z Portugalii, a nie z Brazylii.'],
    textEn: ['“S” at the end of a word and before a consonant sounds like English “sh”.',
             'adeus → adeush, dois → doysh, português → purtugesh.',
             'It’s one of the things that makes European Portuguese sound different from Brazilian.'] },
  { id: 'obrigado', title: 'Grzeczności', titleEn: 'Politeness', emoji: '🙏', bg: ['#0d6b5c', '#06352e'],
    intro: ['Te słowa otwierają każde drzwi.', 'Uwaga: „obrigado / obrigada” zależy od tego, KTO mówi, a nie do kogo.'],
    introEn: ['These words open every door.', 'Note: “obrigado / obrigada” depends on WHO is speaking, not who you talk to.'],
    items: [
      { pt: 'Obrigado', pl: 'Dziękuję (mówi mężczyzna)', en: 'Thank you (said by a man)', say: 'obrigadu',
        note: 'Kobieta mówi: obrigada.', noteEn: 'A woman says: obrigada.' },
      { pt: 'Por favor', pl: 'Proszę (prosząc o coś)', en: 'Please', say: 'pur fawor' },
      { pt: 'De nada', pl: 'Nie ma za co', en: 'You’re welcome', say: 'dy nada' },
      { pt: 'Desculpe', pl: 'Przepraszam', en: 'Sorry / Excuse me', say: 'deszkulp' },
      { pt: 'Com licença', pl: 'Przepraszam (żeby przejść)', en: 'Excuse me (to get past)', say: 'kõ lisẽsa' },
      { pt: 'Sim', pl: 'Tak', en: 'Yes', say: 'sĩ',
        note: '„m” na końcu tylko unosowia samogłoskę.', noteEn: 'The final “m” just makes the vowel nasal.' },
      { pt: 'Não', pl: 'Nie', en: 'No', say: 'nãu' },
    ] },
  { id: 'eu', title: 'Przedstawianie się', titleEn: 'Introducing yourself', emoji: '🙋', bg: ['#8a3b12', '#45190a'],
    intro: ['Powiesz, jak się nazywasz, skąd jesteś i że dopiero się uczysz.'],
    introEn: ['You’ll say your name, where you’re from and that you’re just learning.'],
    items: [
      { pt: 'Chamo-me…', pl: 'Nazywam się…', en: 'My name is…', say: 'szamu-my',
        note: 'W Portugalii „me” stoi PO czasowniku.', noteEn: 'In Portugal “me” goes AFTER the verb.' },
      { pt: 'Como se chama?', pl: 'Jak się Pan/Pani nazywa?', en: 'What’s your name? (formal)', say: 'komu sy szama' },
      { pt: 'Muito prazer', pl: 'Bardzo mi miło', en: 'Nice to meet you', say: 'mũjtu prazer' },
      { pt: 'Sou da Polónia', pl: 'Jestem z Polski', en: 'I’m from Poland', say: 'so da polonja' },
      { pt: 'Não percebo', pl: 'Nie rozumiem', en: 'I don’t understand', say: 'nãu persebu',
        note: 'Typowe dla Portugalii (w Brazylii: não entendo).', noteEn: 'Typical of Portugal (in Brazil: não entendo).' },
      { pt: 'Fala inglês?', pl: 'Mówi Pan/Pani po angielsku?', en: 'Do you speak English? (formal)', say: 'fala inglesz' },
      { pt: 'Estou a aprender português', pl: 'Uczę się portugalskiego', en: 'I’m learning Portuguese', say: 'isztoł a aprẽder purtugesz',
        note: '„estou a + bezokolicznik” = robię coś teraz. Bardzo portugalska konstrukcja.',
        noteEn: '“estou a + infinitive” = I’m doing something right now. A very Portuguese structure.' },
    ] },
  { id: 'num', title: 'Liczby 1–10', titleEn: 'Numbers 1–10', emoji: '🔢', bg: ['#6b1d5c', '#350d2d'],
    intro: ['Liczby przydadzą się od razu: ceny, godziny, numer pokoju.'],
    introEn: ['Numbers are useful right away: prices, times, room numbers.'],
    items: [
      { pt: 'um', pl: '1', say: 'ũ' }, { pt: 'dois', pl: '2', say: 'dojsz' },
      { pt: 'três', pl: '3', say: 'tresz' }, { pt: 'quatro', pl: '4', say: 'kuatru' },
      { pt: 'cinco', pl: '5', say: 'sĩku' }, { pt: 'seis', pl: '6', say: 'sejsz' },
      { pt: 'sete', pl: '7', say: 'set' }, { pt: 'oito', pl: '8', say: 'ojtu' },

    unitDone: 'Unit complete', doneText: (n, perfect) => `You now know ${n} new words${perfect ? ' without a single mistake 🎯' : ''}.`,
    chestTag: 'Mystery box', chestTap: 'tap to open',
    jackpot: 'JACKPOT! +100 XP<small>Only 1 box in 20 has this 🤯</small>',
    rareGot: 'Rare card', collection: 'Collection',
    double: '⚡ Double XP<small>for your next 5 correct answers</small>',
    xp40: '+40 XP<small>Nice!</small>', xp15: '+15 XP<small>The next box might be better 👀</small>',
    rareTag: (n, m) => `✨ Rare card · collection ${n}/${m}`,
    streak: n => `🔥 ${n}-day streak!`, goalT: 'Daily goal reached!', goalS: g => `${g} XP today. Your streak is safe 🔥`,
    level: (l, nm) => `Level ${l}: ${nm}`, toNext: n => `Next level in ${n} XP`, tapContinue: 'tap to continue',
    follow: 'Follow', following: 'Following', followed: h => `Following @${h}`,
    listen: 'listen', send: 'share', liked: 'Liked: this word will come back more often',
    shareText: 'I’m learning Portuguese 🇵🇹', shareMobile: 'Sharing works on mobile',
    ago: ['now', '2m', '14m', '1h', '3h', 'yesterday'], k: 'K', dec: '.',
    capLearn: pt => [`Word of the day: <b>${pt}</b> 🇵🇹`, `Remember this: <b>${pt}</b> 💡`, `I use this every day: <b>${pt}</b>`],
    tagLearn: '#portuguese #vocab', capQuiz: ['Let’s see if you remember 👇', 'Quick test! Answer before you scroll 😉', 'Do you know this? 🤔'],
    capTip: 'You won’t find this in textbooks 😄 <span class="hash">#funfacts</span>',
    capRare: 'Golden card! Hardly anyone gets one ✨ <span class="hash">#collection</span>', tagVideo: '#conversation #listening',
    capChest: 'Something special for active learners 🎁', capDone: t => `Well done! “${t}” complete 🏆`,
    capIntro: t => `New unit: ${t}`, video: 'Video', swipe: '↑ swipe up',
    soundOn: 'Sound: on', soundOff: 'Sound: off', restart: 'Starting over',
    noVoice: v => `No pt-PT voice found, using ${v}`, noTTS: 'This browser can’t read aloud',
    langSet: 'Translations: English 🇬🇧', start: '🇵🇹 Portuguese from zero',
    unmute: '🔇 tap for sound', sample: 'sample · synthetic voice',
  },
};
const t = k => T[S.lang][k];
const isEn = () => S.lang === 'en';
const tr = o => isEn() ? (o.en || o.pl) : o.pl;                     // tłumaczenie słowa / zdania
const noteOf = o => isEn() ? o.noteEn : o.note;
const titleOf = u => (isEn() && u.titleEn) || u.title;
const listOf = (o, k) => (isEn() && o[k + 'En']) || o[k];
/* Wymowa: zapis "po polsku" -> przybliżenie dla anglojęzycznych */
const sayOf = it => !isEn() ? it.say : it.say
  .replace(/y/g, 'ə').replace(/j/g, 'y').replace(/w/g, 'v').replace(/ł/g, 'w')
  .replace(/sz/g, 'sh').replace(/ż/g, 'zh').replace(/ń/g, 'ny');

/* Płaska lista słówek z id */
const ALL = [];
UNITS.forEach(u => (u.items || []).forEach((it, i) => { it.id = u.id + ':' + i; it.unit = u; ALL.push(it); }));
const BY_ID = {}; ALL.forEach(it => { BY_ID[it.id] = it; });

/* =========================================================
   STAN (z bezpiecznym localStorage)
   ========================================================= */
const KEY = 'scroll-pt-v1';
const defaultLang = () => /^pl/i.test(navigator.language || '') ? 'pl' : 'en';
const fresh = () => ({ step: 0, learned: [], mistakes: {}, saved: [], sound: true, seen: 0,
  xp: 0, combo: 0, bestCombo: 0, streak: 0, lastDay: null, today: null, todayXp: 0, rares: [], boost: 0,
  follows: [], watched: [], lang: defaultLang() });
let S = fresh();
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* Plan "nowych" kart: intro działu -> słówka -> puchar, między działami ciekawostki */
const PLAN = [];
UNITS.forEach(u => {
  if (u.tip) { PLAN.push({ type: 'tip', unit: u }); return; }
  PLAN.push({ type: 'intro', unit: u });
  u.items.forEach(it => PLAN.push({ type: 'learn', item: it }));
  PLAN.push({ type: 'done', unit: u });
});

/* =========================================================
   GENERATOR FEEDU: nieskończony, miesza nowe słowa z powtórkami
   ========================================================= */
let cardNo = 0;             // ile kart wygenerowano w tej sesji
const reviewQueue = [];     // [{id, due}] - błędy wracają po kilku kartach
let sinceQuiz = 0;
let nextChestAt = 10;
let nextVideoAt = 6;
const shownVideos = new Set();

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function weightedLearned() {
  // słowa z błędami i polubione (❤️) pojawiają się częściej
  const pool = [];
  S.learned.forEach(id => {
    const w = 1 + (S.mistakes[id] || 0) * 2 + (S.saved.includes(id) ? 2 : 0);
    for (let i = 0; i < w; i++) pool.push(id);
  });
  return pool;
}

function makeQuiz(id) {
  const item = BY_ID[id];
  const sameUnit = item.unit.items.filter(x => x !== item);
  const others = shuffle(sameUnit.length >= 3 ? sameUnit : ALL.filter(x => x !== item)).slice(0, 3);
  const kind = pick(item.unit.id === 'num' ? ['pt2pl', 'pl2pt', 'listen'] : ['pt2pl', 'pl2pt', 'listen', 'pt2pl']);
  return { type: 'quiz', kind, item, options: shuffle([item, ...others]) };
}

function nextCard() {
  cardNo++;
  // 1) zaległa powtórka po błędzie
  const dueIdx = reviewQueue.findIndex(r => r.due <= cardNo);
  if (dueIdx >= 0) { const r = reviewQueue.splice(dueIdx, 1)[0]; sinceQuiz = 0; return makeQuiz(r.id); }
  // 1b) losowe nagrody: skrzynka co 8–14 kart
  if (S.learned.length >= 3 && cardNo >= nextChestAt) { nextChestAt = cardNo + 8 + Math.floor(Math.random() * 7); return { type: 'chest', unit: CHEST_UNIT }; }
  // 1c) filmik co 7–10 kart (z tego, co już umiesz zrozumieć)
  const vids = VIDEOS.filter(v => S.learned.includes(v.req) && !shownVideos.has(v.id));
  if (vids.length && cardNo >= nextVideoAt) {
    nextVideoAt = cardNo + 7 + Math.floor(Math.random() * 4);
    let unseen = vids.filter(v => !S.watched.includes(v.id));
    if (unseen.some(v => v.src)) unseen = unseen.filter(v => v.src);    // prawdziwe nagrania mają pierwszeństwo
    const v = pick(unseen.length ? unseen : vids); shownVideos.add(v.id);   // każdy filmik max raz na sesję
    return { type: 'video', video: v };
  }
  // 1d) rzadka karta z małą szansą
  const rareLeft = RARES.filter(r => !S.rares.includes(r.pt));
  if (S.learned.length >= 5 && rareLeft.length && Math.random() < 0.06) return { type: 'rare', unit: RARE_UNIT, item: pick(rareLeft) };
  // 2) co ~3 karty quiz z tego, co już znasz
  if (S.learned.length >= 3 && sinceQuiz >= 3) { sinceQuiz = 0; return makeQuiz(pick(weightedLearned())); }
  // 3) nowa treść z planu
  if (S.step < PLAN.length) {
    const c = PLAN[S.step++];
    if (c.type === 'learn') { if (!S.learned.includes(c.item.id)) S.learned.push(c.item.id); sinceQuiz++; }
    save();
    return c;
  }
  // 4) koniec materiału: nieskończone powtórki
  sinceQuiz = 0;
  return makeQuiz(pick(weightedLearned()));
}

/* =========================================================
   AUDIO: synteza mowy przeglądarki, preferuje pt-PT
   ========================================================= */
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'pt-PT') || vs.find(v => /pt[-_]PT/i.test(v.lang))
       || vs.find(v => /^pt/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let ttsWarned = false;
function speak(text, pitch, onend) {
  if (!('speechSynthesis' in window)) { if (!ttsWarned) { ttsWarned = true; toast(t('noTTS')); } return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace('…', ''));
  u.lang = 'pt-PT'; if (voice) u.voice = voice; u.rate = .85; u.pitch = pitch || 1;
  if (onend) u.onend = onend;
  speechSynthesis.speak(u);
}

/* =========================================================
   RENDER KART
   ========================================================= */
const feed = document.getElementById('feed');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function bg(u) { return `linear-gradient(160deg, ${u.bg[0]}, ${u.bg[1]})`; }

function render(c) { return decorate(renderInner(c), c); }

/* ===== Opakowanie w "post": autor, podpis, polubienia ===== */
function authorFor(c) {
  if (c.type === 'video') return AUTHORS[c.video.author];
  if (c.type === 'quiz') return AUTHORS.rui;
  if (c.type === 'tip') return AUTHORS.tiago;
  if (c.type === 'rare') return AUTHORS.marta;
  if (c.type === 'learn') return c.item.unit.id === 'cafe' ? AUTHORS.cafe : c.item.unit.id === 'city' ? AUTHORS.tiago : AUTHORS.ines;
  return AUTHORS.app;
}
function hash(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }
const fmt = n => n >= 1000 ? (n / 1000).toFixed(1).replace('.', t('dec')) + t('k') : String(n);
function caption(c) {
  // podpis losujemy raz na post, żeby nie zmieniał się przy przełączaniu języka
  if (c.capSeed === undefined) c.capSeed = Math.floor(Math.random() * 3);
  switch (c.type) {
    case 'learn': return t('capLearn')(esc(c.item.pt))[c.capSeed] + ` <span class="hash">${t('tagLearn')}</span>`;
    case 'quiz': return t('capQuiz')[c.capSeed] + ' <span class="hash">#quiz</span>';
    case 'tip': return t('capTip');
    case 'rare': return t('capRare');
    case 'video': return esc(listOf(c.video, 'caption')) + ` <span class="hash">${t('tagVideo')}</span>`;
    case 'chest': return t('capChest');
    case 'done': return t('capDone')(esc(titleOf(c.unit)));
    default: return t('capIntro')(esc(titleOf(c.unit))) + ' ' + c.unit.emoji;
  }
}
function decorate(el, c) {
  const a = authorFor(c);
  const key = (c.item && (c.item.id || c.item.pt)) || (c.video && c.video.id) || (c.unit && c.unit.title) || '';
  const base = 120 + hash(key + c.type) % 9000;               // stała "liczba polubień" dla danego posta
  if (c.ago === undefined) c.ago = Math.floor(Math.random() * 6);
  const isLearn = c.type === 'learn';
  let liked = isLearn ? S.saved.includes(c.item.id) : !!c.liked;
  const following = S.follows.includes(a.h);

  const meta = document.createElement('div'); meta.className = 'post-meta';
  meta.innerHTML = `<div class="author"><span class="av" style="background:${a.c}">${a.av}</span><b>${esc(a.h)}</b>
      <span class="ago">· ${t('ago')[c.ago]}</span>
      ${a === AUTHORS.app ? '' : `<button class="follow ${following ? 'on' : ''}">${following ? t('following') : t('follow')}</button>`}</div>
    <div class="caption">${caption(c)}</div>`;
  el.appendChild(meta);

  const speakable = c.item && c.type !== 'quiz';             // w quizie głośnik zdradzałby odpowiedź
  const actions = document.createElement('div'); actions.className = 'actions';
  actions.innerHTML = `<button class="act ${liked ? 'on' : ''}" data-a="like" aria-label="Like"><span>❤</span><small>${fmt(base + (liked ? 1 : 0))}</small></button>
    ${speakable ? `<button class="act" data-a="speak" aria-label="${t('listen')}"><span>🔊</span><small>${t('listen')}</small></button>` : ''}
    <button class="act" data-a="share" aria-label="${t('send')}"><span>↗</span><small>${t('send')}</small></button>`;
  el.appendChild(actions);

  const likeBtn = actions.querySelector('[data-a=like]');
  const setLike = on => {
    liked = on; c.liked = on; likeBtn.classList.toggle('on', on); likeBtn.querySelector('small').textContent = fmt(base + (on ? 1 : 0));
    if (on) { sfx('pop'); buzz(10); }
    if (isLearn) {
      const i = S.saved.indexOf(c.item.id);
      if (on && i < 0) { S.saved.push(c.item.id); toast(t('liked')); }
      if (!on && i >= 0) S.saved.splice(i, 1);
      save();
    }
  };
  // po polubieniu (serduszko lub dwuklik) feed sam przechodzi do następnego posta
  const nextPost = () => setTimeout(() => {
    const i = [...feed.children].indexOf(el);
    if (i >= 0 && activeIndex() === i) feed.scrollTo({ top: (i + 1) * feed.clientHeight, behavior: 'smooth' });
  }, 650);
  likeBtn.onclick = () => { setLike(!liked); if (liked) { heart(el); nextPost(); } };
  addDoubleTap(el, () => { if (!liked) setLike(true); heart(el); nextPost(); });
  if (speakable) actions.querySelector('[data-a=speak]').onclick = () => speak(c.item.pt);
  actions.querySelector('[data-a=share]').onclick = () => {
    const txt = c.item ? `🇵🇹 ${c.item.pt} = ${tr(c.item)}` : t('shareText');
    if (navigator.share) navigator.share({ text: txt }).catch(() => {}); else toast(t('shareMobile'));
  };
  const fb = meta.querySelector('.follow');
  if (fb) fb.onclick = () => {
    const i = S.follows.indexOf(a.h);
    if (i < 0) { S.follows.push(a.h); fb.textContent = t('following'); fb.classList.add('on'); toast(t('followed')(a.h)); sfx('pop'); }
    else { S.follows.splice(i, 1); fb.textContent = t('follow'); fb.classList.remove('on'); }
    save();
  };
  return el;
}

/* ===== Filmik: scenka z dymkami + lektor ===== */
function renderVideo(el, c) {
  const v = c.video;
  el.style.background = bg(v); el._card = c; el.dataset.unit = '🎬 ' + t('video');
  if (v.src) return renderRealVideo(el, c);
  el.innerHTML = `<div class="vprog"><i></i></div>
    <div><div class="tag">🎬 ${t('video')} · ${esc(titleOf(v))}</div><div class="scene">${v.scene}</div><div class="bubbles"></div></div>
    <button class="vplay" aria-label="Play">▶</button>`;
  const bubbles = el.querySelector('.bubbles'), prog = el.querySelector('.vprog i'), playBtn = el.querySelector('.vplay');
  let i = 0, playing = false, timer = null, token = 0;
  function step() {
    if (!playing) return;
    if (i >= v.lines.length) {
      playing = false; playBtn.textContent = '↻'; playBtn.style.display = 'grid';
      if (!c.rewarded) {
        c.rewarded = true; if (!S.watched.includes(v.id)) S.watched.push(v.id);
        addXP(15, innerWidth / 2, innerHeight * .4); burst(innerWidth / 2, innerHeight * .4, 50, true); sfx('ok');
      }
      return;
    }
    const L = v.lines[i++], b = document.createElement('div');
    b.className = 'bubble ' + L.who;
    b.innerHTML = `<div class="bpt">${esc(L.pt)}</div><div class="bpl">${esc(tr(L))}</div>`;
    bubbles.appendChild(b);
    while (bubbles.children.length > 4) bubbles.firstChild.remove();
    prog.style.width = (i / v.lines.length * 100) + '%';
    const my = ++token; let done = false;
    const next = () => { if (done || my !== token) return; done = true; clearTimeout(timer); timer = setTimeout(step, 650); };
    if (S.sound) speak(L.pt, L.who === 'B' ? 1.3 : .85, next);  // dwa "głosy" przez różną wysokość
    timer = setTimeout(next, (S.sound ? 2200 : 1400) + L.pt.length * 90); // zapas, gdyby lektor nie zadziałał
  }
  c.play = () => {
    if (playing) return;
    if (i >= v.lines.length) { i = 0; bubbles.innerHTML = ''; prog.style.width = '0'; }
    playing = true; playBtn.style.display = 'none'; step();
  };
  c.stop = () => {
    if (!playing) return;
    playing = false; token++; clearTimeout(timer);
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    playBtn.textContent = '▶'; playBtn.style.display = 'grid';
  };
  playBtn.onclick = e => { e.stopPropagation(); c.play(); };
  return el;
}

/* ===== Prawdziwe wideo: plik mp4 + napisy nakładane z danych (działa przełącznik języka) ===== */
let soundUnlocked = false;   // przeglądarki pozwalają na autoodtwarzanie z dźwiękiem dopiero po dotknięciu
function renderRealVideo(el, c) {
  const v = c.video;
  el.classList.add('real');
  el.innerHTML = `<video src="${esc(v.src)}" ${v.poster ? `poster="${esc(v.poster)}"` : ''} playsinline muted preload="metadata"></video>
    <div class="shade"></div><div class="vprog"><i></i></div>
    ${creditHtml(v.credit, v.sample ? t('sample') : '')}
    <div class="subs"></div>
    <button class="unmute">${t('unmute')}</button>
    <button class="vplay" aria-label="Play" style="display:none">↻</button>`;
  const vid = el.querySelector('video'), subs = el.querySelector('.subs'), prog = el.querySelector('.vprog i');
  const unmute = el.querySelector('.unmute'), replay = el.querySelector('.vplay');
  const paintMute = () => { vid.muted = !(soundUnlocked && S.sound); unmute.style.display = vid.muted ? '' : 'none'; };
  c.applySound = paintMute;
  let shown = -1;
  vid.addEventListener('timeupdate', () => {
    const tt = vid.currentTime;
    if (vid.duration) prog.style.width = (tt / vid.duration * 100) + '%';
    const i = v.lines.findIndex(L => tt >= L.start - .1 && tt <= L.end + .5);
    if (i !== shown || c.subsLang !== S.lang) {
      shown = i; c.subsLang = S.lang;
      subs.innerHTML = i < 0 ? '' : `<span><div class="bpt">${esc(v.lines[i].pt)}</div><div class="bpl">${esc(tr(v.lines[i]))}</div></span>`;
    }
  });
  vid.addEventListener('ended', () => {
    replay.style.display = 'grid'; subs.innerHTML = '';
    if (!c.rewarded) {
      c.rewarded = true; if (!S.watched.includes(v.id)) S.watched.push(v.id);
      addXP(15, innerWidth / 2, innerHeight * .4); burst(innerWidth / 2, innerHeight * .4, 50, true); sfx('ok');
    }
  });
  c.play = () => {
    paintMute(); replay.style.display = 'none';
    vid.play().catch(() => { vid.muted = true; unmute.style.display = ''; vid.play().catch(() => {}); });
  };
  c.stop = () => vid.pause();
  // dotknięcie filmiku = włącz/wyłącz dźwięk, jak na Instagramie
  el.addEventListener('click', e => {
    if (e.target.closest('button:not(.unmute), a, .post-meta')) return;
    if (vid.muted) { soundUnlocked = true; if (!S.sound) { S.sound = true; paintSound(); save(); } }
    else soundUnlocked = false;
    paintMute(); if (vid.paused && !vid.ended) vid.play().catch(() => {});
  });
  replay.onclick = e => { e.stopPropagation(); vid.currentTime = 0; c.play(); };
  return el;
}

/* ===== Zdjęcie jako tło posta + podpis autora/licencji ===== */
function creditHtml(cr, extra) {
  if (!cr) return extra ? `<span class="credit">${esc(extra)}</span>` : '';
  return `<a class="credit" href="${esc(cr.url)}" target="_blank" rel="noopener">📷 ${esc(cr.by)} · ${esc(cr.lic)}${extra ? ' · ' + esc(extra) : ''}</a>`;
}
function applyPhoto(el, key, heavy) {
  const ph = PHOTOS[key]; if (!ph) return false;
  el.classList.add('photo');
  const g = heavy ? 'rgba(0,0,0,.55), rgba(0,0,0,.45) 40%, rgba(0,0,0,.8)'
                  : 'rgba(0,0,0,.4), rgba(0,0,0,.08) 25%, rgba(0,0,0,.45) 50%, rgba(0,0,0,.88)';
  el.style.background = `linear-gradient(to bottom, ${g}), url("${ph.src}") center / cover`;
  el.insertAdjacentHTML('beforeend', creditHtml(ph));
  return true;
}

function renderInner(c) {
  const el = document.createElement('section');
  el.className = 'card';
  if (c.type === 'video') return renderVideo(el, c);
  const unit = c.unit || c.item.unit;
  el.style.background = bg(unit);
  el.dataset.unit = `${unit.emoji} ${titleOf(unit)}`;
  el._card = c;
  if (c.type === 'chest') return renderChest(el, c);
  if (c.type === 'rare') return renderRare(el, c);

  if (c.type === 'done') {
    const n = unit.items.length, errs = unit.items.reduce((a, it) => a + (S.mistakes[it.id] || 0), 0);
    el.innerHTML = `<div><div class="big-emoji">🏆</div><div class="tag">${t('unitDone')}</div>
      <h2 style="font-size:32px;margin:0 0 12px">${esc(titleOf(unit))}</h2>
      <p style="font-size:18px;color:var(--muted)">${esc(t('doneText')(n, errs === 0))}</p>
      <div class="reward">+50 XP</div></div>`;
  }
  else if (c.type === 'intro') {
    el.classList.add('intro');
    el.innerHTML = `<div><div class="big-emoji">${unit.emoji}</div><div class="tag">${t('newUnit')}</div>
      <h2>${esc(titleOf(unit))}</h2>${listOf(unit, 'intro').map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
  }
  else if (c.type === 'tip') {
    el.classList.add('tip');
    el.innerHTML = `<div><div class="big-emoji">${unit.emoji}</div><div class="tag">${t('tip')}</div>
      <h3>${esc(titleOf(unit))}</h3>${listOf(unit, 'text').map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
  }
  else if (c.type === 'learn') {
    const it = c.item, note = noteOf(it);
    el.innerHTML = `<div>
        <div class="tag">${t('newWord')} · ${esc(titleOf(unit))}</div>
        <h1 class="pt">${esc(it.pt)}</h1>
        <div class="say">${t('say')}: <b>[${esc(sayOf(it))}]</b></div>
        <div class="pl ${c.revealed ? 'shown' : ''}">${esc(tr(it))}</div>
        <div class="reveal-hint" style="${c.revealed ? 'visibility:hidden' : ''}">${t('tapReveal')}</div>
        ${note ? `<div class="note">💡 ${esc(note)}</div>` : ''}
      </div>`;
    el.querySelector('.pl').onclick = e => { c.revealed = true; e.currentTarget.classList.add('shown'); el.querySelector('.reveal-hint').style.visibility = 'hidden'; };
  }
  else if (c.type === 'quiz') {
    const it = c.item;
    const prompt = c.kind === 'pt2pl' ? t('qMeaning') : c.kind === 'pl2pt' ? t('qSay') : t('qListen');
    const head = c.kind === 'listen'
      ? `<button class="listen-btn" aria-label="Play">🔊</button>`
      : `<div class="q-word">${esc(c.kind === 'pt2pl' ? it.pt : tr(it))}</div>`;
    const label = o => c.kind === 'pt2pl' ? tr(o) : o.pt;
    el.innerHTML = `<div>
        <div class="tag">${t('check')} · ${esc(titleOf(unit))}</div>
        <div class="q-prompt">${prompt}</div>
        ${head}
        <div class="opts">${c.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(label(o))}</button>`).join('')}</div>
        <div class="feedback"></div>
      </div>`;
    if (c.kind === 'listen') el.querySelector('.listen-btn').onclick = () => speak(it.pt);
    el.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(el, c, +b.dataset.i));
  }

  // zdjęcia: intro działu, słówko, quiz "jak to powiesz" (zdjęcie nie zdradza tam odpowiedzi)
  if (c.type === 'intro') applyPhoto(el, 'U:' + unit.id);
  if (c.type === 'learn') applyPhoto(el, c.item.id);
  if (c.type === 'quiz' && c.kind === 'pl2pt') applyPhoto(el, c.item.id, true);

  if (cardNo === 1 && feed.children.length === 0) {
    const h = document.createElement('div'); h.className = 'swipe-hint'; h.textContent = t('swipe');
    el.appendChild(h);
  }
  return el;
}

function answer(el, c, i) {
  const chosen = c.options[i], ok = chosen === c.item;
  c.answered = true;
  const btns = el.querySelectorAll('.opt');
  btns.forEach((b, j) => { b.disabled = true; if (c.options[j] === c.item) b.classList.add('ok'); });
  const fb = el.querySelector('.feedback');
  const r = btns[i].getBoundingClientRect(), x = r.left + r.width / 2, y = r.top;
  if (ok) {
    S.combo++; S.bestCombo = Math.max(S.bestCombo, S.combo);
    let gain = 10 + Math.min(S.combo - 1, 10) * 2;            // combo podbija nagrodę
    const boosted = S.boost > 0; if (boosted) { gain *= 2; S.boost--; }
    fb.innerHTML = esc(pick(t('praise'))) + (boosted ? ` <span class="boost">${t('boost')(S.boost)}</span>` : '');
    if (S.mistakes[c.item.id]) S.mistakes[c.item.id]--;
    addXP(gain, x, y);
    burst(x, y, 18 + Math.min(S.combo, 10) * 4);
    if (S.combo >= 3 && (S.combo === 3 || S.combo === 5 || S.combo % 5 === 0)) comboBanner(S.combo);
    else sfx('ok');
    buzz(15);
    setTimeout(() => speak(c.item.pt), 350);
  } else {
    btns[i].classList.add('bad');
    if (S.combo >= 3) toast(t('comboBroken')(S.combo, S.bestCombo));
    S.combo = 0;
    fb.textContent = t('wrong')(c.item.pt, tr(c.item));
    S.mistakes[c.item.id] = (S.mistakes[c.item.id] || 0) + 1;
    reviewQueue.push({ id: c.item.id, due: cardNo + 3 });
    ensureBuffer(true);
    sfx('bad'); buzz([30, 40, 30]);
    speak(c.item.pt);
  }
  save();
}

/* ===== Skrzynka z losową nagrodą ===== */
function renderChest(el, c) {
  el.innerHTML = `<div><div class="tag">${t('chestTag')}</div><div class="chest-box">${c.opened ? '🎉' : '🎁'}</div>
    <div class="reveal-hint" style="font-size:16px;${c.opened ? 'display:none' : ''}">${t('chestTap')}</div>
    <div class="slot">${c.rewardHtml ? `<div class="reward">${c.rewardHtml()}</div>` : ''}</div></div>`;
  const box = el.querySelector('.chest-box');
  if (c.opened) box.style.animation = 'none';
  box.onclick = () => {
    if (c.opened) return; c.opened = true;
    box.classList.add('opening'); sfx('chest'); buzz([20, 30, 20, 30, 20]);
    setTimeout(() => {
      box.textContent = '🎉'; box.classList.remove('opening'); box.style.animation = 'none';
      el.querySelector('.reveal-hint').style.display = 'none';
      const rareLeft = RARES.filter(r => !S.rares.includes(r.pt));
      const roll = Math.random();
      if (roll < 0.05) { c.rewardHtml = () => t('jackpot'); addXP(100); }
      else if (roll < 0.15 && rareLeft.length) {
        const rr = pick(rareLeft); S.rares.push(rr.pt);
        c.rewardHtml = () => `${t('rareGot')}: ${esc(rr.pt)}<small>${esc(tr(rr))} · [${esc(sayOf(rr))}]<br>${t('collection')}: ${S.rares.length}/${RARES.length}</small>`;
        addXP(30); speak(rr.pt);
      }
      else if (roll < 0.40) { S.boost += 5; c.rewardHtml = () => t('double'); }
      else if (roll < 0.65) { c.rewardHtml = () => t('xp40'); addXP(40); }
      else { c.rewardHtml = () => t('xp15'); addXP(15); }
      el.querySelector('.slot').innerHTML = `<div class="reward">${c.rewardHtml()}</div>`;
      const r = box.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 80, true);
      save();
    }, 650);
  };
  return el;
}

/* ===== Rzadka karta (złota, do kolekcji) ===== */
function renderRare(el, c) {
  const it = c.item;
  el.classList.add('rare');
  if (c.collectNo === undefined) c.collectNo = S.rares.length + 1;
  el.innerHTML = `<div><div class="tag">${t('rareTag')(c.collectNo, RARES.length)}</div>
    <h1 class="pt">${esc(it.pt)}</h1><div class="say">${t('say')}: <b>[${esc(sayOf(it))}]</b></div>
    <div class="pl shown">${esc(tr(it))}</div><div class="note">💡 ${esc(noteOf(it))}</div>
    <div class="reward">+30 XP</div></div>`;
  applyPhoto(el, 'rare:' + it.pt);
  return el;
}

/* ===== XP, poziomy, streak, cel dnia ===== */
const dayStr = d => d.toISOString().slice(0, 10);
function addXP(n, x, y) {
  const today = dayStr(new Date()), yest = dayStr(new Date(Date.now() - 864e5));
  if (S.today !== today) {                                   // pierwszy XP dnia -> streak
    S.streak = S.lastDay === yest ? S.streak + 1 : 1;
    S.lastDay = S.today = today; S.todayXp = 0;
    if (S.streak > 1) setTimeout(() => toast(t('streak')(S.streak)), 600);
  }
  const lvBefore = levelOf(S.xp), goalBefore = S.todayXp >= DAILY_GOAL;
  S.xp += n; S.todayXp += n;
  if (x !== undefined) floatXP('+' + n + ' XP', x, y);
  paintStats(true);
  if (!goalBefore && S.todayXp >= DAILY_GOAL) setTimeout(() => celebrate('🎯', t('goalT'), t('goalS')(DAILY_GOAL)), 900);
  const lv = levelOf(S.xp);
  if (lv > lvBefore) setTimeout(() => celebrate(lv, t('level')(lv, levelName(lv)), t('toNext')(Math.pow(lv, 2) * 25 - S.xp)), 700);
  save();
}
function paintStats(bump) {
  document.getElementById('xpN').textContent = S.xp;
  document.getElementById('streakN').textContent = S.streak;
  const today = dayStr(new Date());
  document.getElementById('streak').classList.toggle('cold', S.today !== today);
  const p = Math.min(1, (S.today === today ? S.todayXp : 0) / DAILY_GOAL);
  document.getElementById('goalRing').style.strokeDashoffset = 56.5 * (1 - p);
  if (bump) { const s = document.getElementById('xpStat'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
}
function floatXP(text, x, y) {
  const f = document.createElement('div'); f.className = 'floatxp'; f.textContent = text;
  f.style.left = x + 'px'; f.style.top = y + 'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
}
function comboBanner(n) {
  const b = document.getElementById('combo');
  b.textContent = `🔥 x${n} COMBO!`; b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
  sfx('combo'); buzz([20, 30, 20, 30, 60]);
  burst(innerWidth / 2, innerHeight * .22, 60 + n * 4, true);
}
function celebrate(big, title, sub) {
  const o = document.getElementById('overlay');
  o.innerHTML = `<div><div class="lv">${big}</div><h2>${esc(title)}</h2><p>${esc(sub)}</p>
    <p style="margin-top:28px;font-size:14px">${t('tapContinue')}</p></div>`;
  o.classList.add('show'); sfx('level'); buzz([40, 50, 40, 50, 120]);
  const boom = () => burst(innerWidth * (.2 + Math.random() * .6), innerHeight * (.25 + Math.random() * .3), 90, true);
  boom(); setTimeout(boom, 300); setTimeout(boom, 650);
  const close = () => o.classList.remove('show');
  o.onclick = close; clearTimeout(celebrate._t); celebrate._t = setTimeout(close, 3500);
}

/* ===== Konfetti (canvas) ===== */
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
let parts = [], fxRunning = false;
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
sizeFx(); addEventListener('resize', sizeFx);
function burst(x, y, n, gold) {
  const cols = gold ? ['#ffd23f', '#ffb000', '#fff3b0', '#ff8a00'] : ['#34c77b', '#ffd23f', '#5ac8fa', '#ff5a5f', '#af7cff', '#fff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 8;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, r: 3 + Math.random() * 4, c: pick(cols),
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 60 + Math.random() * 40 });
  }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(tick); }
}
function tick() {
  const d = devicePixelRatio; ctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0);
  parts.forEach(p => {
    p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x * d, p.y * d); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.fillRect(-p.r * d, -p.r * d * .5, p.r * 2 * d, p.r * d); ctx.restore();
  });
  if (parts.length) requestAnimationFrame(tick); else { fxRunning = false; ctx.clearRect(0, 0, fx.width, fx.height); }
}

/* ===== Dźwięki (syntezowane, bez plików) i wibracje ===== */
let AC = null;
addEventListener('pointerdown', () => { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }, { once: true });
function tone(f, t0, dur, type = 'sine', vol = .18) {
  const o = AC.createOscillator(), g = AC.createGain(), tt = AC.currentTime + t0;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, tt);
  g.gain.linearRampToValueAtTime(vol, tt + .01); g.gain.exponentialRampToValueAtTime(.001, tt + dur);
  o.connect(g).connect(AC.destination); o.start(tt); o.stop(tt + dur + .05);
}
function sfx(kind) {
  if (!S.sound || !AC) return;
  const seq = {
    ok:    [[784, 0, .12], [1175, .08, .22]],
    pop:   [[1200, 0, .07, 'sine', .12]],
    bad:   [[220, 0, .18, 'triangle'], [185, .1, .25, 'triangle']],
    combo: [[523, 0, .1], [659, .07, .1], [784, .14, .1], [1047, .21, .35]],
    chest: [[392, 0, .08, 'square', .08], [523, .1, .08, 'square', .08], [659, .2, .08, 'square', .08], [1047, .55, .4], [1319, .62, .5]],
    level: [[523, 0, .15], [659, .15, .15], [784, .3, .15], [1047, .45, .5], [784, .45, .5, 'triangle', .1]],
  }[kind];
  seq.forEach(s => tone(s[0], s[1], s[2], s[3], s[4]));
}
function buzz(p) { try { if (S.sound && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

function addDoubleTap(el, fn) {
  let last = 0;
  el.addEventListener('pointerup', e => {
    if (e.target.closest('button, .pl, .chest-box')) return;
    const now = Date.now();
    if (now - last < 300) { fn(); last = 0; } else last = now;
  });
}
function heart(el) {
  const h = document.createElement('div'); h.className = 'heart'; h.textContent = '❤️';
  el.appendChild(h); setTimeout(() => h.remove(), 900);
}

/* =========================================================
   NIESKOŃCZONY SCROLL + wykrywanie aktywnej karty
   ========================================================= */
const BUFFER = 4; // ile kart trzymamy "pod spodem"
function activeIndex() { return Math.round(feed.scrollTop / feed.clientHeight); }

function ensureBuffer(rebuildAhead) {
  const idx = activeIndex();
  // po błędzie w quizie przebuduj karty, których jeszcze nie widziałeś, żeby powtórka trafiła na swoje miejsce
  if (rebuildAhead) {
    while (feed.children.length - 1 > idx + 1) {
      const last = feed.lastElementChild;
      if (last._card.type === 'quiz') { io.unobserve(last); feed.removeChild(last); cardNo--; }
      else break;
    }
  }
  while (feed.children.length - idx <= BUFFER) feed.appendChild(observe(render(nextCard())));
}

const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    const el = en.target, c = el._card;
    if (!en.isIntersecting || en.intersectionRatio < .6) {   // karta zjechała z ekranu -> pauza filmiku
      if (el._active) { el._active = false; if (c.stop) c.stop(); }
      return;
    }
    el._active = true;
    document.getElementById('unitLabel').textContent = el.dataset.unit;
    if (c.play) setTimeout(() => { if (el._active) c.play(); }, 450);   // filmik startuje sam
    if (c.seen) return;
    c.seen = true;
    S.seen++; save();
    document.getElementById('progress').style.width = Math.min(100, S.step / PLAN.length * 100) + '%';
    if (c.type === 'learn') addXP(2);
    if (c.type === 'done') { addXP(50, innerWidth / 2, innerHeight * .55); burst(innerWidth / 2, innerHeight * .4, 120, true); sfx('combo'); buzz([20, 30, 60]); }
    if (c.type === 'rare' && !S.rares.includes(c.item.pt)) {
      S.rares.push(c.item.pt); addXP(30, innerWidth / 2, innerHeight * .6);
      burst(innerWidth / 2, innerHeight * .35, 100, true); sfx('chest');
    }
    if (S.sound && c.type === 'learn') setTimeout(() => speak(c.item.pt), 250);
    if (S.sound && c.type === 'quiz' && c.kind === 'listen') setTimeout(() => speak(c.item.pt), 250);
    ensureBuffer();
  });
}, { root: feed, threshold: [.6] });
function observe(el) { io.observe(el); return el; }

/* Klawiatura na komputerze: strzałki / spacja */
document.addEventListener('keydown', e => {
  if (['ArrowDown', 'ArrowUp', ' ', 'PageDown', 'PageUp'].includes(e.key)) {
    e.preventDefault();
    const dir = ['ArrowUp', 'PageUp'].includes(e.key) ? -1 : 1;
    feed.scrollTo({ top: (activeIndex() + dir) * feed.clientHeight, behavior: 'smooth' });
  }
});

/* =========================================================
   UI
   ========================================================= */
function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}
const soundBtn = document.getElementById('soundBtn'), langBtn = document.getElementById('langBtn');
const paintSound = () => soundBtn.textContent = S.sound ? '🔊' : '🔇';
const paintLang = () => { langBtn.textContent = isEn() ? '🇬🇧' : '🇵🇱'; document.documentElement.lang = S.lang; };
soundBtn.onclick = () => {
  S.sound = !S.sound; if (S.sound) soundUnlocked = true; paintSound(); save(); toast(S.sound ? t('soundOn') : t('soundOff'));
  [...feed.children].forEach(el => el._card.applySound && el._card.applySound());
};

/* Przełącznik języka: przerysowuje karty w miejscu, zachowując ich stan (odpowiedzi, skrzynki, polubienia) */
langBtn.onclick = () => {
  S.lang = isEn() ? 'pl' : 'en'; save(); paintLang();
  const idx = activeIndex();
  [...feed.children].forEach((el, i) => {
    const c = el._card;
    if (c.type === 'quiz' && c.answered) return;             // rozwiązany quiz zostawiamy jak był
    if (c.type === 'video' && el._active) return;             // nie przerywamy oglądanego filmiku
    if (c.stop) c.stop();
    const n = render(c);
    io.unobserve(el); feed.replaceChild(observe(n), el);
    if (i === idx) document.getElementById('unitLabel').textContent = n.dataset.unit;
  });
  toast(t('langSet'));
};

document.getElementById('resetBtn').onclick = () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  S = Object.assign(fresh(), { lang: S.lang, sound: S.sound }); save();
  feed.innerHTML = ''; cardNo = 0; reviewQueue.length = 0; sinceQuiz = 0;
  nextChestAt = 10; nextVideoAt = 6; shownVideos.clear();
  ensureBuffer(); paintSound(); paintStats();
  feed.scrollTop = 0; toast(t('restart'));
};

/* Start: jeśli wracasz, zaczynasz od krótkiej powtórki */
paintSound(); paintLang(); paintStats();
document.getElementById('unitLabel').textContent = t('start');
if (S.learned.length >= 3) { for (let k = 0; k < 2; k++) reviewQueue.push({ id: pick(weightedLearned()), due: 0 }); }
ensureBuffer();
setTimeout(() => { if (voice && !/pt[-_]PT/i.test(voice.lang)) toast(t('noVoice')(voice.lang)); }, 1500);
</script>
